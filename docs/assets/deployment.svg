<text x="170.0" y="395.0" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="middle">Next.js frontend</text>
<line x1="282.0" y1="379.0" x2="328.0" y2="379.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="330.0" y="342.0" width="230.0" height="74.0" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/>
<text x="445.0" y="376.0" font-size="15" font-weight="700" fill="#1b1f2a" text-anchor="middle">Render</text>
<text x="445.0" y="395.0" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="middle">FastAPI API in Docker</text>
<line x1="562.0" y1="379.0" x2="608.0" y2="379.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="610.0" y="342.0" width="160.0" height="74.0" rx="10" fill="#fdf0d5" stroke="#a15c07" stroke-width="1.5"/>
<text x="690.0" y="376.0" font-size="15" font-weight="700" fill="#1b1f2a" text-anchor="middle">Supabase</text>
<text x="690.0" y="395.0" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="middle">PostgreSQL</text>
<rect x="790.0" y="342.0" width="150.0" height="74.0" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="865.0" y="376.0" font-size="15" font-weight="700" fill="#1b1f2a" text-anchor="middle">Monitoring</text>
<text x="865.0" y="395.0" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="middle">Sentry · UptimeRobot</text>
