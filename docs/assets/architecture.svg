<title id="t">Nova AI architecture</title>
<desc id="d">Sources feed an ingestion engine that writes to PostgreSQL. A FastAPI backend serves a Next.js dashboard and runs three engines: grounded Ask-AI, a LangGraph agent workflow and analytics. Celery workers handle background jobs; the LLM provider only narrates and never sees raw rows.</desc>
